name: v1.5.130 memory stability repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-memory-stability-v15130b.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply repair
        run: python .github/scripts/memory_stability_v15130.py
      - name: Validate
        run: |
          node --check js/filters-list.js
          node --check js/workspace-default-main-v15122.js
          test "$(grep -c 'observer.observe(document.documentElement' js/workspace-default-main-v15122.js || true)" = "0"
          test "$(grep -c 'observer.observe(btn' js/workspace-default-main-v15122.js || true)" = "1"
          grep -q 'virtualProgramRowsBound' js/filters-list.js
          grep -q 'v1.5.130' version.json
          grep -q 'v1.5.130' index.html
          grep -q 'v1.5.130' program-workspace-test.html
      - name: Commit repair
        run: |
          git config user.name "WNMU Programming maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Stabilize program list memory and publish v1.5.130"
          git push origin main
