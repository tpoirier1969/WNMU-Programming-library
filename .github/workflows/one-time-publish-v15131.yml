name: Publish v1.5.131 cache keys
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-time-publish-v15131.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump release and changed-file cache keys
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          for name in ('index.html','program-workspace-test.html'):
              p=Path(name); s=p.read_text()
              s=s.replace("window.WNMU_APP_VERSION = 'v1.5.130'", "window.WNMU_APP_VERSION = 'v1.5.131'")
              s=s.replace('>v1.5.130</span>', '>v1.5.131</span>')
              s=s.replace('js/data-store.js?v=1.5.47', 'js/data-store.js?v=1.5.131')
              s=s.replace('js/filters-list.js?v=1.5.129', 'js/filters-list.js?v=1.5.131')
              s=s.replace('js/editor-export.js?v=1.5.47', 'js/editor-export.js?v=1.5.131')
              s=s.replace('js/workspace-default-main-v15122.js?v=1.5.129', 'js/workspace-default-main-v15122.js?v=1.5.131')
              p.write_text(s)
          p=Path('version.json'); d=json.loads(p.read_text())
          for k in ('currentAppVersion','requiredAppVersion','publishedVersion','appVersion','version','legacyCompatibilityVersion'): d[k]='v1.5.131'
          d['notes']='v1.5.131 fixes Search Text after Fast View removal, avoids oversized localStorage program-cache writes, and refreshes cache keys for the memory-stability modules.'
          d['updated']='2026-08-25T19:35:00Z'
          p.write_text(json.dumps(d,indent=2)+'\n')
          Path('.github/workflows/one-time-publish-v15131.yml').unlink()
          PY
          grep -q "data-store.js?v=1.5.131" index.html
          grep -q "filters-list.js?v=1.5.131" index.html
          grep -q "editor-export.js?v=1.5.131" index.html
          grep -q "workspace-default-main-v15122.js?v=1.5.131" index.html
          grep -q '"currentAppVersion": "v1.5.131"' version.json
      - name: Commit release
        run: |
          git config user.name "WNMU Programming maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Publish v1.5.131 search and cache stability fixes"
          git push origin main
