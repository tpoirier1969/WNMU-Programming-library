name: One-time fix search owner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-fix-search-owner.yml'

permissions:
  contents: write

jobs:
  fix-search-owner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make search single-owner and publish v1.5.129
        shell: python
        run: |
          from pathlib import Path
          import json, re

          # 1) Search timing belongs to filters-list.js.
          p = Path('js/filters-list.js')
          text = p.read_text(encoding='utf-8')
          old = 'const PROGRAM_SEARCH_IDLE_MS = 2000;'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one PROGRAM_SEARCH_IDLE_MS=2000, found {text.count(old)}')
          text = text.replace(old, 'const PROGRAM_SEARCH_IDLE_MS = 667;', 1)
          p.write_text(text, encoding='utf-8')

          # 2) Remove the duplicate capture-phase search owner from editor defaults.
          p = Path('js/workspace-new-program-defaults-rating-v15125.js')
          text = p.read_text(encoding='utf-8')
          if text.count("  const SEARCH_IDLE_MS = 667;\n") != 1:
              raise SystemExit('SEARCH_IDLE_MS marker missing or duplicated')
          text = text.replace("  const SEARCH_IDLE_MS = 667;\n", '', 1)
          if text.count("  let searchTimer = null;\n") != 1:
              raise SystemExit('searchTimer marker missing or duplicated')
          text = text.replace("  let searchTimer = null;\n", '', 1)
          pattern = re.compile(r"\n  function installSearchDelay\(\) \{.*?\n  \}\n", re.S)
          text, n = pattern.subn('\n', text, count=1)
          if n != 1:
              raise SystemExit(f'Expected one installSearchDelay function, removed {n}')
          old_ready = "    const ready = installOpenEditorDefaults()\n      && installRatingRenderer()\n      && installDistributorMemory()\n      && installSearchDelay();"
          new_ready = "    const ready = installOpenEditorDefaults()\n      && installRatingRenderer()\n      && installDistributorMemory();"
          if text.count(old_ready) != 1:
              raise SystemExit('install() search-delay ownership chain did not match exactly')
          text = text.replace(old_ready, new_ready, 1)
          if 'search667Owner' in text or 'stopImmediatePropagation()' in text and "searchInput" in text:
              raise SystemExit('Search ownership remnants still present in editor defaults')
          p.write_text(text, encoding='utf-8')

          # 3) Bump the dynamic editor-defaults cache key in its existing loader.
          p = Path('js/workspace-default-main-v15122.js')
          text = p.read_text(encoding='utf-8')
          old = "loadModule('js/workspace-new-program-defaults-rating-v15125.js?v=1.5.125.2', 'editor-defaults-rating');"
          new = "loadModule('js/workspace-new-program-defaults-rating-v15125.js?v=1.5.129', 'editor-defaults-rating');"
          if text.count(old) != 1:
              raise SystemExit('Editor-defaults loader cache key did not match exactly')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          # 4) Publish version/cache changes on both workspace entry pages.
          for path in ('index.html', 'program-workspace-test.html'):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              replacements = {
                  "window.WNMU_APP_VERSION = 'v1.5.128'": "window.WNMU_APP_VERSION = 'v1.5.129'",
                  'js/filters-list.js?v=1.5.128': 'js/filters-list.js?v=1.5.129',
                  'js/workspace-default-main-v15122.js?v=1.5.125': 'js/workspace-default-main-v15122.js?v=1.5.129',
                  '<span id="appVersion" class="version-pill">v1.5.128</span>': '<span id="appVersion" class="version-pill">v1.5.129</span>',
              }
              for old, new in replacements.items():
                  if text.count(old) != 1:
                      raise SystemExit(f'{path}: expected one {old!r}, found {text.count(old)}')
                  text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8')

          # 5) Update release manifest.
          p = Path('version.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          for key in ('currentAppVersion','requiredAppVersion','publishedVersion','appVersion','version','legacyCompatibilityVersion'):
              data[key] = 'v1.5.129'
          data['notes'] = 'v1.5.129 fixes Search Text by restoring a single search owner. The 4-character search now uses the normal filter event path with a 667 ms debounce; the duplicate capture-phase handler and stopImmediatePropagation override were removed from the editor-defaults module.'
          data['updated'] = '2026-08-25T19:05:00Z'
          p.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')

          # Guardrail: one input binding remains in events.js and no duplicate search owner remains.
          events = Path('js/events.js').read_text(encoding='utf-8')
          if events.count("els.searchInput?.addEventListener('input', scheduleSearchUpdate);") != 1:
              raise SystemExit('Expected exactly one normal search input binding in events.js')
          editor_defaults = Path('js/workspace-new-program-defaults-rating-v15125.js').read_text(encoding='utf-8')
          if 'searchInput' in editor_defaults or 'installSearchDelay' in editor_defaults or 'search667Owner' in editor_defaults:
              raise SystemExit('Duplicate search ownership remains in editor defaults')

          Path('.github/workflows/one-time-fix-search-owner.yml').unlink()

      - name: Commit search fix
        run: |
          git config user.name "WNMU Programming maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix Search Text ownership and publish v1.5.129"
          git push origin main
