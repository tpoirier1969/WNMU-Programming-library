<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WNMU TV Programming Library v1.5.106 · Add Program</title>
  <link rel="icon" type="image/svg+xml" href="program-new-tab-icon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="program-new-tab-icon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="program-new-tab-icon-16.png" />
  <link rel="shortcut icon" href="program-new-tab-icon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="program-new-tab-icon-180.png" />
  <link rel="stylesheet" href="styles.css?v=1.5.51" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>window.WNMU_APP_VERSION = 'v1.5.106'; window.WNMU_VERSION_MANIFEST = 'version.json';</script>
  <style>
    body.standalone-page { overflow-y: auto; background: #eef3f7; }
    .standalone-shell { max-width: 1180px; margin: 0 auto; padding: 18px; }
    .standalone-topbar {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      background: #fff; border-radius: 18px; padding: 16px 18px; box-shadow: 0 10px 30px rgba(12,39,68,.08);
      margin-bottom: 16px; flex-wrap: wrap;
    }
    .standalone-brand { display:flex; align-items:center; gap:14px; min-width: 280px; }
    .standalone-brand img { width: 62px; height: 62px; object-fit: contain; }
    .standalone-subtitle { color:#4a647a; font-size:.92rem; }
    .standalone-actions { display:flex; flex-wrap:wrap; gap:10px; }
    .standalone-grid { display:grid; grid-template-columns: minmax(0, 1fr); gap:16px; }
    .standalone-card {
      background:#fff; border-radius:18px; padding:18px; box-shadow:0 10px 30px rgba(12,39,68,.08);
    }
    .standalone-note { margin: 0; color:#30485f; }
    .standalone-mini { margin:6px 0 0; color:#567086; font-size:.92rem; }
    .standalone-auth-row { display:flex; justify-content:space-between; gap:12px; align-items:center; flex-wrap:wrap; }
    .standalone-auth-message { min-height: 1.25rem; color:#7c1d1d; font-weight:700; }
    .standalone-inline-grid { display:grid; grid-template-columns: 1.45fr auto; gap:10px; align-items:end; }
    .standalone-results { margin-top: 10px; display:grid; gap:8px; }
    .template-result-btn {
      width:100%; text-align:left; border:1px solid #d3dee8; border-radius:12px; padding:10px 12px; background:#f8fbfd; cursor:pointer;
    }
    .template-result-btn:hover, .template-result-btn:focus-visible { background:#eef6fc; border-color:#8eb4d4; }
    .template-result-title { font-weight:800; color:#0f3554; }
    .template-result-meta { color:#5f7386; font-size:.88rem; }
    .standalone-feedback { min-height: 1.2rem; margin-top: 8px; font-weight:700; }
    .standalone-feedback.info { color:#325d85; }
    .standalone-feedback.success { color:#0f6b3d; }
    .standalone-feedback.warn { color:#8a5a11; }
    .standalone-feedback.error { color:#8a1e1e; }
    .standalone-success { margin-top: 12px; padding: 12px 14px; border-radius: 14px; background:#edf9f1; border:1px solid #b9e1c4; color:#145a31; }
    .standalone-success.hidden { display:none; }
    .standalone-actions-row { display:flex; gap:10px; flex-wrap:wrap; }
    .muted-block { color:#5f7386; font-size:.92rem; }
    .hidden { display:none !important; }
    @media (max-width: 760px) {
      .standalone-shell { padding: 12px; }
      .standalone-inline-grid { grid-template-columns: 1fr; }
      .standalone-topbar { padding: 14px; }
      .standalone-brand img { width: 52px; height: 52px; }
    }

    .new-program-core-row,
    .new-program-distribution-row,
    .new-program-rights-row,
    .new-program-airing-row {
      display: grid;
      gap: 10px 12px;
      align-items: end;
    }
    .new-program-core-row { grid-template-columns: minmax(170px, .85fr) minmax(170px, .85fr) minmax(190px, 1fr) minmax(230px, 1.2fr); }
    .new-program-distribution-row { grid-template-columns: minmax(240px, 1.25fr) minmax(150px, .75fr) minmax(170px, .85fr); }
    .new-program-rights-row { grid-template-columns: minmax(190px, .9fr) minmax(190px, .9fr) minmax(280px, 1.4fr); }
    .new-program-airing-row { grid-template-columns: minmax(260px, 1fr) minmax(260px, 1fr) minmax(260px, 1fr); }
    .new-program-airing-row .editor-rating-row { margin-top: 0; }
    .new-program-airing-row .rating-field { min-width: 0; }
    .new-program-airing-row .editor-star-rating { width: 100%; }
    @media (max-width: 940px) {
      .new-program-core-row,
      .new-program-distribution-row,
      .new-program-rights-row,
      .new-program-airing-row { grid-template-columns: 1fr 1fr; }
      .new-program-rights-row .rights-notes-field,
      .new-program-airing-row .editor-rating-row { grid-column: 1 / -1; }
    }
    @media (max-width: 620px) {
      .new-program-core-row,
      .new-program-distribution-row,
      .new-program-rights-row,
      .new-program-airing-row { grid-template-columns: 1fr; }
    }


    /* v1.5.57 compact Add Program layout */
    body.standalone-page {
      font-size: 14px;
      line-height: 1.25;
    }
    .standalone-shell {
      max-width: 1260px;
      padding: 10px 14px;
    }
    .standalone-topbar {
      padding: 10px 18px;
      margin-bottom: 10px;
      border-radius: 18px;
      gap: 12px;
    }
    .standalone-brand { gap: 10px; }
    .standalone-brand img { width: 52px; height: 52px; }
    .standalone-brand .brand-name { font-size: 1.05rem; }
    .standalone-brand h1 { font-size: 1.85rem; line-height: 1; }
    .standalone-actions { gap: 8px; align-items: center; }
    .standalone-actions a,
    .standalone-actions button,
    .drawer-actions button,
    .drawer-actions a {
      padding: 8px 12px;
      min-height: 36px;
    }
    .compact-pbs-btn { min-width: 0; }
    .standalone-grid { gap: 10px; }
    .standalone-card {
      padding: 14px 18px;
      border-radius: 18px;
    }
    .pbs-import-card.hidden { display: none !important; }
    .pbs-import-card:not(.hidden) { padding: 12px 16px; }
    .pbs-import-panel:not(.hidden) { display: grid; gap: 8px; }
    .pbs-import-field textarea { min-height: 120px; }
    .program-form .form-grid { gap: 8px 12px; }
    .program-form label { font-size: .91rem; }
    .standalone-page input,
    .standalone-page select,
    .standalone-page textarea {
      font-size: .95rem;
    }
    .standalone-page input,
    .standalone-page select {
      min-height: 36px;
      padding-top: 7px;
      padding-bottom: 7px;
    }
    .standalone-page textarea {
      padding-top: 8px;
      padding-bottom: 8px;
    }
    .standalone-page textarea[name="notes"] {
      min-height: 74px;
    }
    .new-program-core-row,
    .new-program-distribution-row,
    .new-program-rights-row,
    .new-program-airing-row {
      gap: 8px 12px;
    }
    .new-program-core-row {
      grid-template-columns: minmax(185px, .82fr) minmax(185px, .82fr) minmax(220px, .98fr) minmax(270px, 1.18fr);
    }
    .new-program-distribution-row {
      grid-template-columns: minmax(320px, 1.15fr) minmax(200px, .78fr) minmax(220px, .86fr);
    }
    .new-program-rights-row {
      grid-template-columns: minmax(210px, .82fr) minmax(210px, .82fr) minmax(260px, 1fr);
      align-items: end;
    }
    .new-program-airing-row {
      grid-template-columns: minmax(300px, 1fr) minmax(300px, 1fr) minmax(300px, .95fr);
      align-items: end;
    }
    .rights-notes-field input {
      width: 100%;
      min-height: 36px;
    }
    .standalone-page .date-entry-wrap {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 0;
      align-items: center;
      position: relative;
    }
    .standalone-page .date-picker-btn,
    .standalone-page .date-picker-proxy {
      display: none !important;
    }
    .new-program-airing-row .editor-rating-row,
    .new-program-airing-row .rating-field {
      margin: 0;
    }
    .new-program-airing-row .editor-star-rating {
      min-height: 36px;
      padding: 5px 10px;
      align-items: center;
    }
    .new-program-airing-row .star-rating-btn {
      font-size: 1.24rem;
      line-height: 1;
      padding: 0 3px;
    }
    .new-program-airing-row .rating-value-label {
      font-size: .9rem;
      white-space: nowrap;
      margin-left: 8px;
    }
    .standalone-feedback {
      min-height: 1rem;
      margin-top: 6px;
      font-size: 1rem;
    }
    .standalone-success { margin-top: 8px; padding: 8px 10px; }
    .standalone-actions-row { margin-top: 8px; }
    @media (max-height: 850px) and (min-width: 940px) {
      .standalone-page textarea[name="notes"] { min-height: 60px; }
      .standalone-topbar { padding-top: 8px; padding-bottom: 8px; }
      .standalone-card { padding-top: 12px; padding-bottom: 12px; }
    }

  </style>
  <script defer src="js/program-new.js?v=1.5.47"></script>
  <script defer src="js/program-new-bridge.js?v=1.5.57"></script>
  <script defer src="js/import-pbs.js?v=1.5.47"></script>
  <script defer src="js/program-new-ui-v15106.js?v=1.5.106"></script>
</head>
<body class="standalone-page">
  <div id="setupNotice" class="standalone-shell hidden">
    <div class="standalone-card">
      <h1>WNMU TV Programming Library</h1>
      <p>Create <code>config.js</code> from <code>config.example.js</code>, then add your Supabase URL and anon key.</p>
    </div>
  </div>

  <div id="pageShell" class="standalone-shell hidden">
    <header class="standalone-topbar">
      <div class="standalone-brand">
        <img src="wnmu-programming-library-mark.png" alt="WNMU TV Programming Library" />
        <div>
          <div class="brand-name">WNMU-TV PBS</div>
          <div class="title-row">
            <h1 style="margin:0;">Add New Program</h1>
            <span class="version-pill">v1.5.106</span>
          </div>
          <div id="statusLine" class="status-line">Starting up…</div>
        </div>
      </div>
      <div class="standalone-actions">
        <a href="index.html" class="ghost" id="backToLibraryTop">Back to library</a>
        <a href="monthly-media.html" class="ghost">Monthly media</a>
        <a href="holidays-calendar.html" class="ghost">Holidays / events</a>
        <button type="button" id="togglePbsImportBtn" class="secondary compact-pbs-btn">Paste PBS offer</button>
        <button type="button" id="loginGitHubBtn" class="primary">Sign in with GitHub</button>
        <button type="button" id="logoutBtn" class="hidden">Sign out</button>
      </div>
      <div id="authStateText" class="hidden" aria-live="polite"></div>
      <div id="authMessage" class="hidden" aria-live="polite"></div>
    </header>

    <div class="standalone-grid">
      <section id="pbsImportCard" class="standalone-card pbs-import-card hidden">
        <div id="pbsImportPanel" class="pbs-import-panel hidden">
          <label class="pbs-import-field">PBS offer text
            <textarea id="pbsOfferInput" rows="8" placeholder="Paste the PBS program offer here."></textarea>
          </label>
          <div class="pbs-import-controls">
            <label class="pbs-import-mode-field">Draft style
              <select id="pbsImportMode">
                <option value="series">Series record from release title</option>
                <option value="program">Program draft from first listed episode</option>
              </select>
            </label>
            <button type="button" id="parsePbsOfferBtn" class="primary">Parse PBS offer</button>
            <button type="button" id="clearPbsOfferBtn" class="ghost">Clear</button>
          </div>
          <div id="pbsImportPreview" class="pbs-import-preview hidden"></div>
        </div>
      </section>

      <section class="standalone-card">
        <div id="duplicateCheck" class="duplicate-check hidden"></div>
        <form id="programForm" class="program-form">
          <div class="form-grid">
            <label class="row-title">Title
              <input name="title" type="text" required />
            </label>
            <label class="row-nola">NOLA
              <input name="nola_eidr" type="text" />
            </label>
            <label class="row-length">Length
              <input name="length_minutes" type="text" />
            </label>
            <label class="row-use">Use?
              <input name="legacy_code" type="text" placeholder="AM250 / Y / N / M" />
            </label>

            <label class="span-full">Description
              <textarea name="notes" rows="3"></textarea>
            </label>

            <div class="new-program-core-row span-full">
              <label>Program or series
                <select name="program_type">
                  <option value=""></option>
                  <option value="Program">Program</option>
                  <option value="Series">Series</option>
                </select>
              </label>
              <label>Season / Episode
                <input name="episode_season" type="text" placeholder="100's / 8" />
              </label>
              <label>Topic
                <select name="topic"></select>
              </label>
              <label class="secondary-topic-field">Secondary topic
                <input name="secondary_topic" type="text" list="secondaryTopicList" placeholder="Select or type one or more topics, separated by commas" />
                <datalist id="secondaryTopicList"></datalist>
              </label>
            </div>

            <div class="new-program-distribution-row span-full">
              <label class="distributor-field">Distributor
                <input name="distributor" type="text" list="distributorList" placeholder="Choose or type a new distributor" />
                <datalist id="distributorList"></datalist>
              </label>
              <label>Source
                <select name="server_tape"></select>
              </label>
              <label>Package type
                <select name="package_type"></select>
              </label>
              <label class="hidden-field" id="voteFieldWrap">Vote
                <select name="vote">
                  <option value=""></option>
                  <option value="Y">Y</option>
                  <option value="N">N</option>
                  <option value="M">M</option>
                </select>
              </label>
            </div>

            <div class="new-program-rights-row span-full">
              <label class="compact-rights">Rights begin
                <div class="date-entry-wrap">
                  <input name="rights_begin" type="text" inputmode="numeric" placeholder="3/20/26 or 3/20/2026" />
                </div>
              </label>
              <label class="compact-rights">Rights end
                <div class="date-entry-wrap">
                  <input name="rights_end" type="text" inputmode="numeric" placeholder="3/20/26 or 3/20/2026" />
                </div>
              </label>
              <label class="rights-notes-field">Rights notes
                <input name="rights_notes" type="text" />
              </label>
            </div>

            <div class="new-program-airing-row span-full">
              <label>Aired on 13.1
                <input name="aired_13_1" type="text" placeholder="No" />
              </label>
              <label>Aired on 13.3
                <input name="aired_13_3" type="text" placeholder="No" />
              </label>
              <div class="editor-rating-row">
                <label class="rating-field">Rating
                  <input name="rating" type="hidden" />
                  <div id="editorRating" class="star-rating editor-star-rating" role="radiogroup" aria-label="Program rating">
                    <button type="button" class="star-rating-btn" data-editor-rating="1" aria-label="1 star" role="radio" aria-checked="false" tabindex="-1">★</button>
                    <button type="button" class="star-rating-btn" data-editor-rating="2" aria-label="2 stars" role="radio" aria-checked="false" tabindex="-1">★</button>
                    <button type="button" class="star-rating-btn" data-editor-rating="3" aria-label="3 stars" role="radio" aria-checked="false" tabindex="-1">★</button>
                    <button type="button" class="star-rating-btn" data-editor-rating="4" aria-label="4 stars" role="radio" aria-checked="false" tabindex="-1">★</button>
                    <button type="button" class="star-rating-btn" data-editor-rating="5" aria-label="5 stars" role="radio" aria-checked="false" tabindex="-1">★</button>
                    <span class="rating-value-label">Not rated</span>
                  </div>
                </label>
              </div>
            </div>
          </div>

          <div id="formFeedback" class="standalone-feedback"></div>
          <div id="successBox" class="standalone-success hidden"></div>

          <div class="drawer-actions standalone-actions-row">
            <button type="submit" id="saveAnotherBtn" class="primary" data-submit-action="another">Save and start another</button>
            <button type="button" id="clearFormBtn" class="ghost">Clear form</button>
            <a href="index.html" class="ghost">Open library</a>
          </div>
        </form>
      </section>
    </div>
  </div>
</body>
</html>
